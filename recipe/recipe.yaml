schema_version: 1

context:
  version: "5.12.0"

package:
  name: aws-lc
  version: ${{ version }}

source:
  url: https://github.com/aws/aws-lc/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 52c7f98ffd296d267cc015ad4653d1ffae399db65b14421da4f5f7efc44becd2
  patches:
    - allow-dist-pkg-on-macos-and-windows.patch

build:
  number: 0

requirements:
  # Upstream keeps the SONAME at .so.1 across releases but only guarantees ABI
  # stability on LTS branches; every mainline release bumps the minor version.
  run_exports:
    - ${{ pin_subpackage("aws-lc", upper_bound="x.x") }}
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    # GENERATE_RUST_BINDINGS runs bindgen so that aws-lc-sys can link this
    # package instead of its bundled copy. bindgen needs clang's resource
    # headers (stddef.h, ...) and a clang executable to find system headers.
    - bindgen-cli
    - clang
    # perl is not available on win-arm64; build.bat falls back to the
    # pre-generated assembly in generated-src/ there.
    - if: not (win and arm64)
      then:
        - perl
    - if: win and x86_64
      then:
        - nasm
    # Only used to regenerate err_data.c; when cross-compiling, `go run` would
    # build for the target, so fall back to the pre-generated sources instead.
    - if: build_platform == target_platform
      then:
        - ${{ compiler('go-nocgo') }}

tests:
  - script:
      - aws-lc-bssl version
      - aws-lc-openssl version
      - pkg-config --exists --print-errors aws-lc
    requirements:
      run:
        - pkg-config
  - package_contents:
      bin:
        - aws-lc-bssl
        - aws-lc-openssl
      include:
        - aws-lc/openssl/ssl.h
        - aws-lc/openssl/crypto.h
      lib:
        - crypto-awslc
        - ssl-awslc
      files:
        - if: unix
          then:
            - lib/pkgconfig/aws-lc.pc
            - share/rust/aws_lc_bindings.rs
          else:
            - Library/lib/pkgconfig/aws-lc.pc
            - Library/share/rust/aws_lc_bindings.rs
  - script:
      - if: unix
        then: grep -q "pub fn EVP_aead_aes_128_gcm" $PREFIX/share/rust/aws_lc_bindings.rs
        else: findstr /C:"pub fn EVP_aead_aes_128_gcm" %LIBRARY_PREFIX%\share\rust\aws_lc_bindings.rs
  # Compile and link a small program against the installed library to verify
  # the headers, pkg-config metadata and shared libraries are all consistent.
  - files:
      recipe:
        - test_link.c
    script:
      - if: unix
        then:
          - ${{ "$CC" }} $CFLAGS $LDFLAGS test_link.c -o test_link $(pkg-config --cflags --libs aws-lc)
          - ./test_link
        else:
          # BORINGSSL_SHARED_LIBRARY makes the headers use __declspec(dllimport).
          - cl.exe /nologo /DBORINGSSL_SHARED_LIBRARY /I%LIBRARY_INC%\aws-lc test_link.c /Fe:test_link.exe /link /LIBPATH:%LIBRARY_LIB% ssl-awslc.lib crypto-awslc.lib
          - test_link.exe
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - pkg-config

about:
  homepage: https://github.com/aws/aws-lc
  summary: AWS-LC is a general-purpose cryptographic library maintained by AWS
  description: |
    AWS-LC is a general-purpose cryptographic library maintained by the AWS
    Cryptography team for AWS and their customers. It is based on code from
    Google's BoringSSL project and the OpenSSL project.

    AWS-LC contains portable C implementations of algorithms needed for TLS
    and common applications, with optimized assembly versions for x86 and
    ARM on several platforms.

    To avoid conflicting with the `openssl` package, this build installs its
    headers under `$PREFIX/include/aws-lc/openssl`, names the libraries
    `libcrypto-awslc` and `libssl-awslc`, and prefixes the command line tools
    with `aws-lc-`. Consumers should use the `aws-lc`, `libcrypto-awslc` or
    `libssl-awslc` pkg-config files, or the CMake packages `crypto` and `ssl`.
  license: (Apache-2.0 OR ISC) AND Apache-2.0 AND ISC AND MIT AND MIT-0 AND BSD-3-Clause
  license_file:
    - LICENSE
    - NOTICE
    - third_party/fiat/LICENSE
    - third_party/s2n-bignum/s2n-bignum-imported/LICENSE
    - third_party/jitterentropy/jitterentropy-library/LICENSE
    - third_party/jitterentropy/jitterentropy-library/LICENSE.bsd
  documentation: https://github.com/aws/aws-lc/tree/main/docs
  repository: https://github.com/aws/aws-lc

extra:
  recipe-maintainers:
    - pavelzw
    - xhochy
